<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse — Bandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="main-content">
    <header class="page-header">
      <div>
        <h1><i class="fa-solid fa-guitar"></i> Bandas &amp; Clientes</h1>
        <p class="page-subtitle">Gerencie o cadastro de bandas e responsáveis.</p>
      </div>
      <button class="btn btn-primary" id="btnNovaBanda">
        <i class="fa-solid fa-plus"></i> Nova Banda
      </button>
    </header>

    <div class="search-bar glass">
      <div class="input-icon" style="flex:1">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="campoBusca" placeholder="Buscar por banda ou responsável…">
      </div>
      <button class="btn btn-primary" id="btnBuscar">Buscar</button>
      <button class="btn btn-ghost" id="btnLimpar">Limpar</button>
    </div>

    <section class="section-card glass">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr><th>#</th><th>Banda</th><th>Responsável</th><th>Telefone</th><th>Gênero</th><th>Cadastro</th><th>Ações</th></tr>
          </thead>
          <tbody id="tbodyBandas">
            <tr><td colspan="7" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal Criar/Editar -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal glass">
      <div class="modal-header">
        <h2 id="modalTitulo">Nova Banda</h2>
        <button class="modal-close" id="btnFecharModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="formBanda" novalidate>
        <input type="hidden" id="inputId">
        <div class="form-grid">
          <div class="form-group span-2">
            <label for="nome_banda">Nome da Banda *</label>
            <input type="text" id="nome_banda" placeholder="Ex: The Analog Keys" required>
            <span class="field-error" id="err-nome_banda"></span>
          </div>
          <div class="form-group">
            <label for="responsavel">Responsável *</label>
            <input type="text" id="responsavel" placeholder="Nome completo" required>
            <span class="field-error" id="err-responsavel"></span>
          </div>
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(11) 99999-9999">
          </div>
          <div class="form-group span-2">
            <label for="genero">Gênero Musical</label>
            <input type="text" id="genero" placeholder="Rock, Jazz, MPB…">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="btnCancelarModal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Excluir -->
  <div class="modal-overlay" id="modalDelOverlay">
    <div class="modal modal-sm glass">
      <div class="modal-header">
        <h2><i class="fa-solid fa-triangle-exclamation"></i> Confirmar Exclusão</h2>
        <button class="modal-close" id="btnFecharModalDel"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p id="textoConfirmacao" style="margin:1rem 0 1.5rem;color:var(--text-secondary)"></p>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="btnCancelarDel">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnConfirmarDel"><i class="fa-solid fa-trash"></i> Excluir</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../scripts/script.js"></script>
  <script src="../scripts/bandas.js"></script>
</body>
</html>
