<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse — Relatórios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <!-- Libs de exportação -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="main-content">
    <header class="page-header">
      <div>
        <h1><i class="fa-solid fa-chart-line"></i> Relatórios</h1>
        <p class="page-subtitle">Análise de desempenho e faturamento do estúdio.</p>
      </div>
      <div class="export-btns">
        <button class="btn btn-ghost" id="btnExcel"><i class="fa-solid fa-file-excel"></i> Excel</button>
        <button class="btn btn-primary" id="btnPdf"><i class="fa-solid fa-file-pdf"></i> PDF</button>
      </div>
    </header>

    <div class="search-bar glass">
      <label style="font-weight:500;color:var(--text-secondary)">Período:</label>
      <div class="input-icon">
        <i class="fa-regular fa-calendar"></i>
        <input type="date" id="dataIni">
      </div>
      <span style="color:var(--text-muted)">até</span>
      <div class="input-icon">
        <i class="fa-regular fa-calendar-check"></i>
        <input type="date" id="dataFim">
      </div>
      <button class="btn btn-primary" id="btnAtualizar">Atualizar</button>
    </div>

    <section class="kpi-grid" id="kpiRel"></section>

    <section class="section-card glass" id="secTopBandas" style="display:none">
      <div class="section-header"><h2><i class="fa-solid fa-trophy"></i> Top 5 Bandas</h2></div>
      <div class="table-responsive">
        <table class="data-table">
          <thead><tr><th>Banda</th><th>Agendamentos</th><th>Faturamento</th></tr></thead>
          <tbody id="tbodyTop"></tbody>
        </table>
      </div>
    </section>

    <section class="section-card glass">
      <div class="section-header"><h2><i class="fa-solid fa-table-list"></i> Detalhamento</h2></div>
      <div class="table-responsive">
        <table class="data-table" id="tabelaRelatorio">
          <thead>
            <tr><th>#</th><th>Banda</th><th>Data</th><th>Horário</th><th>Valor</th><th>Status</th><th>Responsável</th></tr>
          </thead>
          <tbody id="tbodyRel">
            <tr><td colspan="7" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../scripts/script.js"></script>
  <script src="../scripts/relatorios.js"></script>
</body>
</html>
