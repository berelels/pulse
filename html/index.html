<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">

  <div class="login-bg">
    <div class="login-blob blob1"></div>
    <div class="login-blob blob2"></div>
  </div>

  <main class="login-container">
    <div class="login-card glass">
      <div class="login-logo">
        <i class="fa-solid fa-circle-waveform-lines"></i>
        <span>Pulse</span>
      </div>
      <p class="login-subtitle">Gestão para Estúdios de Gravação</p>

      <div class="alert alert-error" id="alertErro" style="display:none"></div>

      <form id="formLogin" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-icon">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" placeholder="admin@pulse.studio" autocomplete="email" required>
          </div>
          <span class="field-error" id="err-email"></span>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="btnToggleSenha" aria-label="Mostrar senha">
              <i class="fa-regular fa-eye" id="iconeOlho"></i>
            </button>
          </div>
          <span class="field-error" id="err-senha"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btnLogin">
          <span id="btnLoginText">Entrar</span>
          <i class="fa-solid fa-arrow-right" id="btnLoginIcon"></i>
          <i class="fa-solid fa-circle-notch fa-spin" id="btnLoginSpinner" style="display:none"></i>
        </button>
      </form>

      <p class="login-hint">Acesso restrito à equipe do estúdio.</p>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../scripts/script.js"></script>
  <script src="../scripts/login.js"></script>
</body>
</html>
