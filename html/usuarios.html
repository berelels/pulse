<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse — Usuários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="main-content">
    <header class="page-header">
      <div>
        <h1><i class="fa-solid fa-users-gear"></i> Usuários do Sistema</h1>
        <p class="page-subtitle">Apenas administradores podem gerenciar a equipe.</p>
      </div>
      <button class="btn btn-primary" id="btnNovoUser"><i class="fa-solid fa-user-plus"></i> Convidar Usuário</button>
    </header>

    <section class="section-card glass">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr><th>Nome</th><th>E-mail</th><th>Nível</th><th>Cadastro</th><th>Ações</th></tr>
          </thead>
          <tbody id="tbodyUsers">
            <tr><td colspan="5" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal Editar Perfil -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal glass">
      <div class="modal-header">
        <h2 id="modalTitulo">Editar Usuário</h2>
        <button class="modal-close" id="btnFecharModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="formUser" novalidate>
        <input type="hidden" id="inputId">
        <div class="form-grid">
          <div class="form-group span-2">
            <label for="nome">Nome completo *</label>
            <input type="text" id="nome" placeholder="João da Silva" required>
            <span class="field-error" id="err-nome"></span>
          </div>
          <div class="form-group span-2">
            <label for="email">E-mail</label>
            <input type="email" id="email" disabled style="opacity:.6">
          </div>
          <div class="form-group span-2">
            <label class="checkbox-label">
              <input type="checkbox" id="is_admin" name="is_admin" value="1">
              <span>Conceder acesso de Administrador</span>
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="btnCancelarModal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Convidar -->
  <div class="modal-overlay" id="modalConvidarOverlay">
    <div class="modal modal-sm glass">
      <div class="modal-header">
        <h2><i class="fa-solid fa-envelope"></i> Convidar Usuário</h2>
        <button class="modal-close" id="btnFecharConvidar"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p style="color:var(--text-secondary);margin-bottom:1rem;font-size:.9rem">
        O usuário receberá um e-mail para definir sua senha via Supabase Auth.
      </p>
      <div class="form-group">
        <label for="emailConvite">E-mail *</label>
        <input type="email" id="emailConvite" placeholder="usuario@email.com">
        <span class="field-error" id="err-emailConvite"></span>
      </div>
      <div class="modal-footer" style="margin-top:1rem">
        <button type="button" class="btn btn-ghost" id="btnCancelarConvidar">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnEnviarConvite">
          <i class="fa-solid fa-paper-plane"></i> Enviar Convite
        </button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../scripts/script.js"></script>
  <script src="../scripts/usuarios.js"></script>
</body>
</html>
