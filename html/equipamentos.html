<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse — Equipamentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="main-content">
    <header class="page-header">
      <div>
        <h1><i class="fa-solid fa-microphone-lines"></i> Equipamentos</h1>
        <p class="page-subtitle">Catálogo de equipamentos disponíveis para locação.</p>
      </div>
      <button class="btn btn-primary" id="btnNovoEquip"><i class="fa-solid fa-plus"></i> Novo Equipamento</button>
    </header>

    <div class="search-bar glass">
      <div class="input-icon" style="flex:1">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="campoBusca" placeholder="Buscar por nome…">
      </div>
      <select id="filtroStatus" class="select-filter">
        <option value="">Todos os Status</option>
        <option value="disponivel">Disponível</option>
        <option value="manutencao">Manutenção</option>
      </select>
      <button class="btn btn-primary" id="btnBuscar">Filtrar</button>
      <button class="btn btn-ghost"   id="btnLimpar">Limpar</button>
    </div>

    <section class="section-card glass">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr><th>#</th><th>Equipamento</th><th>Descrição</th><th>Valor/Sessão</th><th>Status</th><th>Ações</th></tr>
          </thead>
          <tbody id="tbodyEquip">
            <tr><td colspan="6" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal Criar/Editar -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal glass">
      <div class="modal-header">
        <h2 id="modalTitulo">Novo Equipamento</h2>
        <button class="modal-close" id="btnFecharModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="formEquip" novalidate>
        <input type="hidden" id="inputId">
        <div class="form-grid">
          <div class="form-group span-2">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" placeholder="Ex: Marshall JCM800" required>
            <span class="field-error" id="err-nome"></span>
          </div>
          <div class="form-group span-2">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Breve descrição técnica">
          </div>
          <div class="form-group">
            <label for="valor_locacao">Valor por Sessão (R$) *</label>
            <input type="number" id="valor_locacao" step="0.01" min="0" placeholder="0.00" required>
            <span class="field-error" id="err-valor_locacao"></span>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="disponivel">Disponível</option>
              <option value="manutencao">Manutenção</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="btnCancelarModal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Excluir -->
  <div class="modal-overlay" id="modalDelOverlay">
    <div class="modal modal-sm glass">
      <div class="modal-header">
        <h2><i class="fa-solid fa-triangle-exclamation"></i> Confirmar Exclusão</h2>
        <button class="modal-close" id="btnFecharModalDel"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p id="textoConfirmacao" style="margin:1rem 0 1.5rem;color:var(--text-secondary)"></p>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="btnCancelarDel">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnConfirmarDel"><i class="fa-solid fa-trash"></i> Excluir</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../scripts/script.js"></script>
  <script src="../scripts/equipamentos.js"></script>
</body>
</html>
